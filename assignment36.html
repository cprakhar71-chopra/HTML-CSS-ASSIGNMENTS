<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 25px;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
    }

    h1 {
        text-align: center;
        color: #1e3a8a;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        max-width: 1100px;
        margin: 30px auto;
    }

    .gallery img {
        display: block;
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
    }

    .gallery figure {
        margin: 0;
        padding: 10px;
        background: white;
        border-radius: 12px;
    }

    figcaption {
        padding: 10px 0;
        text-align: center;
    }
</style>
```

</head>
<body>

```
<h1>My Photo Gallery</h1>

<main class="gallery">

    <figure>
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"
             alt="Mountain landscape under the sky">
        <figcaption>Nature</figcaption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80"
             alt="Ocean waves">
        <figcaption>Ocean</figcaption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
             alt="Lake surrounded by mountains">
        <figcaption>Mountains</figcaption>
    </figure>

    <figure>
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
             alt="Sunlight coming through a forest">
        <figcaption>Forest</figcaption>
    </figure>

</main>
```

</html>
