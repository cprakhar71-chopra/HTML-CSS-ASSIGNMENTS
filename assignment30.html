<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e2e8f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 350px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .card-header {
            height: 100px;
            background: #1e3a8a;
        }

        .profile-content {
            padding: 25px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: -75px auto 15px;
            border: 5px solid white;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e3a8a;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .role {
            color: #64748b;
        }

        .description {
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 22px;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>

    <article class="profile-card">

        <div class="card-header"></div>

        <div class="profile-content">

            <div class="avatar" aria-label="Profile initials">YN</div>

            <h1>Your Name</h1>

            <p class="role">Student | Web Development Learner</p>

            <p class="description">
                I am learning HTML, CSS, and programming.
                I enjoy building websites and improving my coding skills.
            </p>

            <a class="button" href="mailto:your-email@example.com">
                Contact Me
            </a>

        </div>

    </article>

</body>
</html>
