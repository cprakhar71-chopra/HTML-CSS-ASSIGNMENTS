<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
    }

    .dashboard {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 70px 1fr 50px;
        grid-template-areas:
            "header header"
            "sidebar main"
            "footer footer";
    }

    header {
        grid-area: header;
        display: flex;
        align-items: center;
        padding: 20px;
        background: #1e3a8a;
        color: white;
    }

    aside {
        grid-area: sidebar;
        padding: 20px;
        background: #dbeafe;
    }

    main {
        grid-area: main;
        padding: 25px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
    }

    .card {
        padding: 20px;
        background: white;
        border-radius: 10px;
    }

    footer {
        grid-area: footer;
        padding: 15px;
        text-align: center;
        background: #0f172a;
        color: white;
    }

    @media (max-width: 600px) {
        .dashboard {
            grid-template-columns: 1fr;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas:
                "header"
                "sidebar"
                "main"
                "footer";
        }
    }
</style>
```

</head>
<body>

```
<div class="dashboard">

    <header>
        <h1>My Dashboard</h1>
    </header>

    <aside>
        <h2>Menu</h2>
        <p>Overview</p>
        <p>Reports</p>
        <p>Settings</p>
    </aside>

    <main>
        <h2>Overview</h2>

        <div class="stats">
            <section class="card">
                <h3>Students</h3>
                <p>120</p>
            </section>

            <section class="card">
                <h3>Courses</h3>
                <p>8</p>
            </section>

            <section class="card">
                <h3>Projects</h3>
                <p>24</p>
            </section>
        </div>
    </main>

    <footer>
        Dashboard Assignment - 2026
    </footer>

</div>
```

</body>
</html>
