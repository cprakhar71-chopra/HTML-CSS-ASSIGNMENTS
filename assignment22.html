<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>

    <style>
        /* 1. Element selector */
        p {
            color: #374151;
            line-height: 1.6;
        }

        /* 2. Class selector */
        .highlight {
            background-color: #fef3c7;
            padding: 10px;
        }

        /* 3. ID selector */
        #main-heading {
            color: #1d4ed8;
            text-align: center;
        }

        /* 4. Descendant selector */
        section p {
            font-style: italic;
        }

        /* 5. Group selector */
        h2, h3 {
            font-family: Georgia, serif;
        }

        /* 6. Attribute selector */
        input[type="email"] {
            border: 2px solid #2563eb;
            padding: 8px;
        }
    </style>
</head>
<body>

    <h1 id="main-heading">CSS Selector Practice</h1>

    <p>This paragraph uses an element selector.</p>

    <p class="highlight">This paragraph uses a class selector.</p>

    <section>
        <h2>About CSS</h2>
        <p>This paragraph is styled using a descendant selector.</p>
    </section>

    <h3>Contact</h3>

    <form>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </form>

</body>
</html>
